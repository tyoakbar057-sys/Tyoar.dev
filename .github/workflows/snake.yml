name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at 00:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: tyoakbar057-sys
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300e5ff&color_dots=%23e8f5e9,%23b9f6ca,%2369f0ae,%2300c853,%2300a844
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300e5ff&color_dots=%230b1f14,%230f542c,%23158a48,%2300c853,%2300ff66

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
